<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nova Bet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo">NOVA<span>BET</span></div>
      <button id="top-balance" class="balance-pill" aria-label="Wallet"><span class="coin">●</span><span id="top-balance-amt">—</span><span class="plus">+</span></button>
    </header>
    <div id="screen"><div class="spinner"></div></div>

    <nav id="bottom-nav">
      <button class="nav-btn" data-route="home"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span></button>
      <button class="nav-btn" data-route="play"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="15.5" cy="11.5" r="1"/><circle cx="18" cy="14" r="1"/></svg><span>Play</span></button>
      <button class="nav-btn" data-route="friends"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 5.2a3.3 3.3 0 010 6.2M18.5 14.4c2 .8 3.2 2.7 3.2 5.6"/></svg><span>Friends</span></button>
      <button class="nav-btn" data-route="wallet"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="14" rx="3"/><path d="M2.5 10h19"/><circle cx="17" cy="15" r="1.2"/><path d="M5 6l11-3 1 3"/></svg><span>Wallet</span></button>
      <button class="nav-btn" data-route="profile"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Profile</span></button>
    </nav>
  </div>

  <script src="app.js"></script>
  <script src="flight.js"></script>
  <script src="ui2.js"></script>
</body>
</html>
